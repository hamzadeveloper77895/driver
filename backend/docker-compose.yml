version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: chauffeurx_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chauffeurx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chauffeurx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chauffeurx_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chauffeurx} -d ${POSTGRES_DB:-chauffeurx_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chauffeurx_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chauffeurx_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chauffeurx}:${POSTGRES_PASSWORD:-chauffeurx_secret}@db:5432/${POSTGRES_DB:-chauffeurx_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-chauffeurx_super_secret_jwt_key_2026_change_in_production}
      ENVIRONMENT: production
    volumes:
      - .:/app

volumes:
  postgres_data:
  redis_data:
